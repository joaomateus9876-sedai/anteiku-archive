<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar personagem | Anteiku Archive</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="main-content">
        <section class="registration">
            <p class="eyebrow">ARQUIVO CONFIDENCIAL</p>
            <h2>Editar personagem</h2>
            <p class="form-description">
                Atualize as informações deste registro no arquivo do Anteiku.
            </p>

            <form action="{{ url_for('salvar_edicao', id=personagem['id']) }}" method="POST" class="character-form">

                <div class="form-group">
                    <label for="nome">Nome do personagem</label>
                    <input type="text" id="nome" name="nome" value="{{ personagem['nome'] }}" required>
                </div>

                <div class="form-group">
                    <label for="especie">Espécie</label>
                    <select id="especie" name="especie" required>
                        <option value="Humano" {% if personagem['especie']=='Humano' %}selected{% endif %}>Humano
                        </option>
                        <option value="Ghoul" {% if personagem['especie']=='Ghoul' %}selected{% endif %}>Ghoul</option>
                        <option value="Meio-ghoul" {% if personagem['especie']=='Meio-ghoul' %}selected{% endif %}>
                            Meio-ghoul</option>
                        <option value="Outro" {% if personagem['especie']=='Outro' %}selected{% endif %}>Outro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="classificacao">Classificação</label>
                    <input type="text" id="classificacao" name="classificacao"
                        value="{{ personagem['classificacao'] or '' }}">
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" name="descricao" rows="4">{{ personagem['descricao'] or '' }}</textarea>
                </div>

                <button type="submit" class="primary-button">
                    SALVAR ALTERAÇÕES
                </button>
            </form>

            <p style="margin-top: 20px;">
                <a href="{{ url_for('home') }}">Voltar ao arquivo</a>
            </p>
        </section>
    </main>

</body>

</html>
